[versions]
kotlin = "2.4.21"
agp = "9.5.2"
compose-multiplatform = "1.13.0-rc01"
wire = "7.2.2"
ktor = "3.6.1"
coroutines = "1.11.0"
serialization = "1.13.0"
kermit = "2.2.0"
clikt = "5.2.1"
metro = "1.6.0"
kotest = "6.2.7"
turbine = "1.2.1"

android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Plugin artifacts, for build-logic's classpath.
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
