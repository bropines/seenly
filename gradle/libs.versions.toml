[versions]
kotlin = "2.4.21"
agp = "9.5.2"
compose-multiplatform = "1.13.0-rc01"
wire = "7.2.2"
ktor = "3.6.1"
coroutines = "1.11.0"
serialization = "1.13.0"
kermit = "2.2.0"
clikt = "5.2.1"
metro = "1.6.0"
kotest = "6.2.7"
turbine = "1.2.1"
camerax = "1.7.0"
room = "2.8.5"
ksp = "2.3.14"

android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test ={ module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
# The README renders (app/shared host tests); the version follows the Compose that CMP resolves to.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.13.0-rc01" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.13.0-rc01" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform" }
compose-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.0" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version = "1.2.0" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version = "2.11.0" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.6.3" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version = "0.17.1" }
filekit-coil = { module = "io.github.vinceglb:filekit-coil", version = "0.17.1" }
materialkolor = { module = "com.materialkolor:material-kolor", version = "5.0.1" }

# Android
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
androidx-browser = { module = "androidx.browser:browser", version = "1.10.0" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version = "2.7.1" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version = "15.3.0" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }

# ML Kit, google flavor only. The recognizers are the "unbundled" ones: their models come from
# Google Play services, not the APK. Translation has no such variant; its models are downloaded.
mlkit-text-latin = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version = "19.0.2" }
mlkit-text-chinese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-chinese", version = "16.0.2" }
mlkit-text-japanese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-japanese", version = "16.0.2" }
mlkit-text-korean = { module = "com.google.android.gms:play-services-mlkit-text-recognition-korean", version = "16.0.2" }
mlkit-text-devanagari = { module = "com.google.android.gms:play-services-mlkit-text-recognition-devanagari", version = "16.0.2" }
mlkit-language-id = { module = "com.google.android.gms:play-services-mlkit-language-id", version = "17.0.0" }
mlkit-translate = { module = "com.google.mlkit:translate", version = "17.0.3" }
play-services-base = { module = "com.google.android.gms:play-services-base", version = "18.11.1" }

# Plugin artifacts, for build-logic's classpath.
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version = "15.3.0" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
