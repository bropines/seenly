# Builds the signed release APKs for a version tag and publishes them as a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Before tagging, give the version its section in CHANGELOG.md (and CHANGELOG_RU.md);
# docs/releases/v0.2.0.md, if present, goes above it as the highlights. Pictures for the
# highlights live on the `media` branch, under releases/<version>/.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   LENS_RELEASE_KEYSTORE_BASE64   the .jks file, base64-encoded
#   LENS_RELEASE_STORE_PASSWORD
#   LENS_RELEASE_KEY_ALIAS
#   LENS_RELEASE_KEY_PASSWORD
# Without them the build stops: a release is never signed with the public dev key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.LENS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENS_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing release signing secret for $name"; exit 1; fi
          done
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LENS_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          LENS_RELEASE_STORE_PASSWORD: ${{ secrets.LENS_RELEASE_STORE_PASSWORD }}
          LENS_RELEASE_KEY_ALIAS: ${{ secrets.LENS_RELEASE_KEY_ALIAS }}
          LENS_RELEASE_KEY_PASSWORD: ${{ secrets.LENS_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:android:assembleGoogleRelease :app:android:assembleFossRelease \
            -Plens.versionName="$VERSION" -Plens.versionCode="${{ github.run_number }}" \
            --stacktrace

      - name: Collect and check the APKs
        run: |
          mkdir -p out
          # One APK per flavor and ABI, plus a universal one each: android-google-arm64-v8a-release.apk
          # becomes Seenly-v1.2.3-google-arm64-v8a-release.apk.
          for flavor in google foss; do
            for apk in app/android/build/outputs/apk/$flavor/release/android-$flavor-*-release.apk; do
              part=$(basename "$apk"); part=${part#android-}
              cp "$apk" "out/Seenly-v$VERSION-$part"
            done
          done
          ls -l out
          count=$(ls out/*.apk | wc -l)
          if [ "$count" -ne 10 ]; then echo "::error::Expected 10 APKs, got $count"; exit 1; fi
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in out/*.apk; do
            certs=$("$signer" verify --print-certs "$apk")
            echo "$certs" | grep "certificate DN"
            if echo "$certs" | grep -q "CN=lens-kmp development"; then echo "::error::$apk is signed with the dev key"; exit 1; fi
          done
          # The foss APK promises nothing proprietary; the google one is where ML Kit lives.
          for apk in out/Seenly-v$VERSION-foss-*.apk; do bash scripts/check-foss-apk.sh "$apk"; done
          # The in-app updater picks its APK by these names and verifies it against SHA256SUMS.
          (cd out && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"

      # The highlights in docs/releases/<tag>.md, then the tag's section of CHANGELOG.md.
      - name: Release notes
        run: |
          python3 scripts/release/notes.py "$GITHUB_REF_NAME" release_notes.md
          if ! grep -q . release_notes.md; then echo "::error::No notes for $GITHUB_REF_NAME in CHANGELOG.md"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          name: Seenly ${{ github.ref_name }}
          files: out/*
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
