# Builds the signed release APKs for a version tag and publishes them as a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   LENS_RELEASE_KEYSTORE_BASE64   the .jks file, base64-encoded
#   LENS_RELEASE_STORE_PASSWORD
#   LENS_RELEASE_KEY_ALIAS
#   LENS_RELEASE_KEY_PASSWORD
# Without them the build stops: a release is never signed with the public dev key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.LENS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENS_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing release signing secret for $name"; exit 1; fi
          done
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LENS_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          LENS_RELEASE_STORE_PASSWORD: ${{ secrets.LENS_RELEASE_STORE_PASSWORD }}
          LENS_RELEASE_KEY_ALIAS: ${{ secrets.LENS_RELEASE_KEY_ALIAS }}
          LENS_RELEASE_KEY_PASSWORD: ${{ secrets.LENS_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:android:assembleGoogleRelease :app:android:assembleFossRelease \
            -Plens.versionName="$VERSION" -Plens.versionCode="${{ github.run_number }}" \
            --stacktrace

      - name: Collect and check the APKs
        run: |
          mkdir -p out
          cp app/android/build/outputs/apk/google/release/android-google-release.apk "out/seenly-$VERSION-google.apk"
          cp app/android/build/outputs/apk/foss/release/android-foss-release.apk "out/seenly-$VERSION-foss.apk"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in out/*.apk; do
            certs=$("$signer" verify --print-certs "$apk")
            echo "$certs" | grep "certificate DN"
            if echo "$certs" | grep -q "CN=lens-kmp development"; then echo "::error::$apk is signed with the dev key"; exit 1; fi
          done
          (cd out && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          name: Seenly ${{ env.VERSION }}
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
